name: A5 Linux Canary Bundle

on:
  push:
    branches:
      - agent/a5-linux-canary-20260728
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build OpenNext on Linux
        run: pnpm exec opennextjs-cloudflare build

      - name: Reject Windows paths and broken links
        shell: bash
        run: |
          windows_path_files="$(
            {
              grep -RIlF 'C:\Users\user\' .open-next --include='*.js' --include='*.json' || true
              grep -RIlF 'C:\Users\djfhl\' .open-next --include='*.js' --include='*.json' || true
            } | sort -u
          )"
          if [ -n "$windows_path_files" ]; then
            echo 'Windows absolute paths found in Linux bundle.'
            echo "$windows_path_files"
            exit 1
          fi
          if find -L .open-next -type l -print -quit | grep -q .; then
            echo 'Broken symbolic link found in Linux bundle.'
            exit 1
          fi

      - name: Package portable bundle
        run: tar --dereference -czf a5-open-next-linux.tar.gz .open-next wrangler.jsonc wrangler.canary.jsonc

      - uses: actions/upload-artifact@v4
        with:
          name: a5-open-next-linux
          path: a5-open-next-linux.tar.gz
          if-no-files-found: error
          retention-days: 3
