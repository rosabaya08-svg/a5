name: PayUp Test Infrastructure and Deployment

on:
  workflow_dispatch:
    inputs:
      apply_infrastructure:
        description: "Create/update fixed NAT IP and VPC connector"
        type: boolean
        required: true
        default: true
      deploy_application:
        description: "Deploy Firestore Rules and Firebase Functions"
        type: boolean
        required: true
        default: false
      fixed_ip_registered_with_payup:
        description: "PayUp confirmed that the Terraform output IP is registered"
        type: boolean
        required: true
        default: false
      enable_payup_live_test_calls:
        description: "Allow actual calls to api.testpayup.co.kr after IP registration"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: payup-test-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate fixed-egress Terraform
        working-directory: infra/payup-static-egress
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Install and verify application
        run: |
          npm ci
          npm run check:routes
          node scripts/check-payup-safety.mjs
          npx --yes firebase-tools@14.17.0 emulators:exec --only firestore --project demo-a5-payup "node -e \"console.log('Firestore rules compiled')\""
          npx tsc --noEmit
          npm run build
          npm ci --prefix functions
          npm --prefix functions run build
          npm --prefix functions run test:payup-cart-api

  deploy:
    needs: verify
    if: ${{ inputs.apply_infrastructure || inputs.deploy_application }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: payup-test
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'a5-closed-mall' }}
      REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
      PUBLIC_WEB_ORIGIN: ${{ vars.A5_PUBLIC_WEB_ORIGIN }}
      PAYUP_MERCHANT_ID: ${{ vars.PAYUP_TEST_MERCHANT_ID }}
      EXISTING_VPC_CONNECTOR: ${{ vars.PAYUP_VPC_CONNECTOR }}
      EXISTING_FIXED_EGRESS_IP: ${{ vars.PAYUP_FIXED_EGRESS_IP }}
      BOOTSTRAP_ADMIN_EMAILS: ${{ vars.A5_BOOTSTRAP_SUPER_ADMIN_EMAILS }}
      PAYUP_API_KEY_VALUE: ${{ secrets.PAYUP_API_KEY_REISSUED }}
      PAYUP_API_CERT_KEY_VALUE: ${{ secrets.PAYUP_API_CERT_KEY_REISSUED }}
      ORDER_PII_KEY_VALUE: ${{ secrets.A5_ORDER_PII_ENCRYPTION_KEY }}
      A5LS_HMAC_KEY_VALUE: ${{ secrets.A5LS_GATEWAY_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]] || missing+=(GCP_SERVICE_ACCOUNT)

          if [[ "${{ inputs.deploy_application }}" == "true" ]]; then
            [[ -n "$PAYUP_API_KEY_VALUE" ]] || missing+=(PAYUP_API_KEY_REISSUED)
            [[ -n "$PAYUP_API_CERT_KEY_VALUE" ]] || missing+=(PAYUP_API_CERT_KEY_REISSUED)
            [[ ${#ORDER_PII_KEY_VALUE} -ge 32 ]] || missing+=(A5_ORDER_PII_ENCRYPTION_KEY)
            [[ ${#A5LS_HMAC_KEY_VALUE} -ge 32 ]] || missing+=(A5LS_GATEWAY_HMAC_SECRET)
            [[ -n "$PAYUP_MERCHANT_ID" ]] || missing+=(PAYUP_TEST_MERCHANT_ID_variable)
            [[ -n "$PUBLIC_WEB_ORIGIN" ]] || missing+=(A5_PUBLIC_WEB_ORIGIN_variable)
          fi

          if [[ "${{ inputs.apply_infrastructure }}" != "true" ]]; then
            [[ -n "$EXISTING_VPC_CONNECTOR" ]] || missing+=(PAYUP_VPC_CONNECTOR_variable)
            [[ -n "$EXISTING_FIXED_EGRESS_IP" ]] || missing+=(PAYUP_FIXED_EGRESS_IP_variable)
          fi

          if [[ "${{ inputs.enable_payup_live_test_calls }}" == "true" ]]; then
            [[ "${{ inputs.deploy_application }}" == "true" ]] || { echo "Live PayUp calls require deploy_application=true." >&2; exit 1; }
            [[ "${{ inputs.fixed_ip_registered_with_payup }}" == "true" ]] || { echo "Actual PayUp test calls cannot be enabled until PayUp confirms fixed IP registration." >&2; exit 1; }
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - uses: hashicorp/setup-terraform@v3
        if: ${{ inputs.apply_infrastructure }}
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Create Terraform state bucket
        if: ${{ inputs.apply_infrastructure }}
        shell: bash
        run: |
          set -euo pipefail
          TF_STATE_BUCKET="${PROJECT_ID}-payup-tfstate"
          if ! gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${TF_STATE_BUCKET}" --project "$PROJECT_ID" --location "$REGION" --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://${TF_STATE_BUCKET}" --versioning
          echo "TF_STATE_BUCKET=${TF_STATE_BUCKET}" >> "$GITHUB_ENV"

      - name: Apply fixed NAT IP and VPC connector
        if: ${{ inputs.apply_infrastructure }}
        working-directory: infra/payup-static-egress
        shell: bash
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=payup-static-egress"
          terraform plan -out=tfplan -var="project_id=${PROJECT_ID}" -var="region=${REGION}"
          terraform apply -auto-approve tfplan
          FIXED_IP="$(terraform output -raw payup_static_egress_ip)"
          CONNECTOR="$(terraform output -raw payup_vpc_connector)"
          [[ "$FIXED_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "Terraform did not return a valid IPv4 address." >&2; exit 1; }
          [[ -n "$CONNECTOR" ]] || { echo "Terraform did not return a VPC connector." >&2; exit 1; }
          echo "PAYUP_FIXED_EGRESS_IP=${FIXED_IP}" >> "$GITHUB_ENV"
          echo "PAYUP_VPC_CONNECTOR=${CONNECTOR}" >> "$GITHUB_ENV"
          printf '{"projectId":"%s","region":"%s","fixedEgressIp":"%s","vpcConnector":"%s","createdAt":"%s"}\n' "$PROJECT_ID" "$REGION" "$FIXED_IP" "$CONNECTOR" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$GITHUB_WORKSPACE/payup-fixed-ip-result.json"
          echo "### PayUp fixed egress" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public IP to register with PayUp: \`${FIXED_IP}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- VPC connector: \`${CONNECTOR}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixed-IP result
        if: ${{ inputs.apply_infrastructure }}
        uses: actions/upload-artifact@v4
        with:
          name: payup-fixed-ip-result-${{ github.run_id }}
          path: payup-fixed-ip-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Load existing fixed-egress settings
        if: ${{ !inputs.apply_infrastructure }}
        shell: bash
        run: |
          echo "PAYUP_FIXED_EGRESS_IP=${EXISTING_FIXED_EGRESS_IP}" >> "$GITHUB_ENV"
          echo "PAYUP_VPC_CONNECTOR=${EXISTING_VPC_CONNECTOR}" >> "$GITHUB_ENV"

      - name: Install Node.js and Functions dependencies
        if: ${{ inputs.deploy_application }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        if: ${{ inputs.deploy_application }}
        run: npm ci --prefix functions

      - name: Create or rotate Firebase Secret Manager values
        if: ${{ inputs.deploy_application }}
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if ! gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$PROJECT_ID" --replication-policy=automatic
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=- >/dev/null
          }
          put_secret PAYUP_API_KEY "$PAYUP_API_KEY_VALUE"
          put_secret PAYUP_API_CERT_KEY "$PAYUP_API_CERT_KEY_VALUE"
          put_secret A5_ORDER_PII_ENCRYPTION_KEY "$ORDER_PII_KEY_VALUE"
          put_secret A5LS_GATEWAY_HMAC_SECRET "$A5LS_HMAC_KEY_VALUE"

      - name: Generate Firebase Functions test runtime configuration
        if: ${{ inputs.deploy_application }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE_CALLS="${{ inputs.enable_payup_live_test_calls }}"
          IP_REGISTERED="${{ inputs.fixed_ip_registered_with_payup }}"
          AUTH_RETURN_URL="https://${REGION}-${PROJECT_ID}.cloudfunctions.net/payupMobileAuthReturn"
          cat > "functions/.env.${PROJECT_ID}" <<EOF
          PAYUP_MERCHANT_ID=${PAYUP_MERCHANT_ID}
          PAYUP_ENVIRONMENT=test
          A5S_SOURCE_PROJECT_ID=a5s-mall
          PAYUP_VPC_CONNECTOR=${PAYUP_VPC_CONNECTOR}
          PAYUP_FIXED_EGRESS_IP=${PAYUP_FIXED_EGRESS_IP}
          PAYUP_FIXED_IP_REGISTERED=${IP_REGISTERED}
          PAYUP_LIVE_CALLS_ENABLED=${LIVE_CALLS}
          PAYUP_AUTH_RETURN_URL=${AUTH_RETURN_URL}
          PAYUP_SUCCESS_RETURN_URL=${PUBLIC_WEB_ORIGIN}/orders/guest/live
          PAYUP_FAILURE_RETURN_URL=${PUBLIC_WEB_ORIGIN}/q/live
          PAYUP_SESSION_CLEANUP_ENABLED=true
          PAYUP_RECON_SCHEDULE_ENABLED=${LIVE_CALLS}
          PAYUP_REQUIRE_APP_CHECK=false
          PAYUP_REQUIRE_TABLET_AUTH=true
          PAYUP_ENFORCE_ORIGIN_ALLOWLIST=true
          A5_ALLOWED_PUBLIC_ORIGINS=${PUBLIC_WEB_ORIGIN}
          A5_CHANNEL_RETURN_ORIGINS=https://lussoboutique.co.kr
          A5_BOOTSTRAP_SUPER_ADMIN_EMAILS=${BOOTSTRAP_ADMIN_EMAILS}
          A5_LEGACY_MOCK_PAYMENT_ENABLED=false
          EOF

      - name: Deploy Firestore Rules and Firebase Functions
        if: ${{ inputs.deploy_application }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.17.0 deploy \
            --project "$PROJECT_ID" \
            --only firestore:rules,functions \
            --non-interactive

      - name: Initialize safe PayUp feature flags
        if: ${{ inputs.deploy_application }}
        working-directory: functions
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: node scripts/bootstrapPayupTest.mjs

      - name: Verify deployed function inventory
        if: ${{ inputs.deploy_application }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(payupAdminHealth payupAdminSubmerchants payupPaymentOrder payupPaymentApprove payupMobileAuthReturn payupAdminCancel payupReconcileTransactionsScheduled payupReconcileSettlementsScheduled)
          for name in "${REQUIRED[@]}"; do
            gcloud functions describe "$name" --gen2 --region "$REGION" --project "$PROJECT_ID" --format='value(name)' >/dev/null
          done
          echo "### Firebase deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`${PROJECT_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`${REGION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live test calls: \`${{ inputs.enable_payup_live_test_calls }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PayUp IP registration confirmed: \`${{ inputs.fixed_ip_registered_with_payup }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Critical payment feature flags remain OFF and require 2-person approval." >> "$GITHUB_STEP_SUMMARY"
