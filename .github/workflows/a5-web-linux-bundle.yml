name: A5 Web Linux OpenNext Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_PAYMENT_API_BASE_URL: https://asia-northeast3-a5-closed-mall.cloudfunctions.net
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint release-critical files
        run: >-
          pnpm exec eslint
          components/analytics/VisitTracker.tsx
          components/guest/PgReturnConfirmClient.tsx
          components/guest/ServerCheckoutFlow.tsx
          components/storefront/LiveShopClient.tsx
          lib/firebase/liveShopBackend.ts
          lib/payments/companyPaymentGroups.ts
          lib/payments/paymentBrowserStorage.ts
          lib/payments/paymentEndpoints.ts
          types/commerce.ts

      - name: Verify company order and shipping contracts
        run: |
          node scripts/check-company-operations-contract.mjs
          node scripts/check-company-shipping-contract.mjs

      - name: Verify secrets are not committed
        run: node scripts/check-no-secrets.mjs

      - name: Build Next.js and OpenNext on Linux
        run: pnpm exec opennextjs-cloudflare build

      - name: Produce Windows-deployable Worker bundle
        run: |
          pnpm exec wrangler deploy --dry-run --outdir .cf-package --config wrangler.jsonc
          mv .cf-package cf-package

      - name: Verify bundle outputs
        run: |
          test -f cf-package/worker.js
          test -d .open-next/assets
          test -f .open-next/assets/BUILD_ID
          grep -R -q "https://asia-northeast3-a5-closed-mall.cloudfunctions.net" .open-next/assets

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: a5-web-linux-opennext-${{ github.sha }}
          path: |
            cf-package
            .open-next/assets
          if-no-files-found: error
          retention-days: 1
